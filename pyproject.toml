[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "isoseq-gene-expression-analysis"
version = "1.0.1"
description = "Exploratory gene-expression analysis from Iso-Seq data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Jaeman Shin"}]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "seaborn>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
